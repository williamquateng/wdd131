
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Submit your product review: rate, date installed, features, and feedback.">
  <meta name="author" content="Williams Quateng">
  <meta property="og:title" content="Product Review Form">
  <title>Product Review Form</title>
  <script src="scripts/form.js" defer></script>
  <link rel="stylesheet" href="styles/form.css">
</head>
<body>
  <header></header>
  <div class="form-container">
    <div class="form-header">Product Review</div>
    <form method="get" action="review.html">
      <label for="product-name">Product Name</label>
      <select id="product-name" name="product-name" required>
        <option value="" disabled selected>Select a Product ...</option>
        <!-- options will be populated by JS -->
      </select>

      <label>Overall Rating</label>
      <div class="rating-stars">
        <input type="radio" id="rating-1" name="rating" value="1" required>
        <label for="rating-1">&#9734;</label>
        <input type="radio" id="rating-2" name="rating" value="2" required>
        <label for="rating-2">&#9734;&#9734;</label>
        <input type="radio" id="rating-3" name="rating" value="3" required>
        <label for="rating-3">&#9734;&#9734;&#9734;</label>
        <input type="radio" id="rating-4" name="rating" value="4" required>
        <label for="rating-4">&#9734;&#9734;&#9734;&#9734;</label>
        <input type="radio" id="rating-5" name="rating" value="5" required>
        <label for="rating-5">&#9734;&#9734;&#9734;&#9734;&#9734;</label>
      </div>

      <label for="date-installed">Date of Installation</label>
      <input type="date" id="date-installed" name="date-installed" required>

      <label>Which features did you find useful in the product?<br>(Check all that apply)</label>
      <input type="checkbox" id="feature-1" name="features" value="Durability">
      <label for="feature-1" class="checkbox-label">Durability</label><br>
      <input type="checkbox" id="feature-2" name="features" value="Ease of Use">
      <label for="feature-2" class="checkbox-label">Ease of Use</label><br>
      <input type="checkbox" id="feature-3" name="features" value="Performance">
      <label for="feature-3" class="checkbox-label">Performance</label><br>
      <input type="checkbox" id="feature-4" name="features" value="Design">
      <label for="feature-4" class="checkbox-label">Design</label>

      <label for="written-review">Written Review <span class="optional">(Optional)</span></label>
      <textarea id="written-review" name="written-review" rows="4"></textarea>

      <label for="user-name">Your Name <span class="optional">(Optional)</span></label>
      <input type="text" id="user-name" name="user-name">

      <input type="submit" value="Post Review">
    </form>
    <div class="footer">
      <footer>
        <p>&copy;2026 <span id="copyright-year"></span>Williams Quateng</p>
        <p><span id="last-modified"></span></p>
      </footer>
   </form>
  </div>
</body>
</html>
